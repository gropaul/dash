#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    # tags are built by release.yml, which calls the same pipeline
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-next-build:
    name: Build extension binaries (main)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      # DuckDB's CMake parses DUCKDB_VERSION as a version, so the branch goes in duckdb_commit.
      # Bump to main's scripts/ci/release_version.txt when it moves on.
      duckdb_commit: main
      duckdb_version: v2.1.0-dev0
      ci_tools_version: main
      extension_name: dash

  duckdb-stable-build:
    name: Build extension binaries (stable)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: dash